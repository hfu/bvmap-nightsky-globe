<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bvmap-nightsky on a globe</title>
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      #map { height: 100vh; }
      /* Ortho Earth's own layer control (Places/Terrain/Rail/... and themes) is replaced by the bvmap one below. */
      #layers-btn, #layers-panel { display: none !important; }
      #bvl { position: fixed; top: 10px; left: 10px; z-index: 5; font: 12px/1.4 system-ui, sans-serif; color: #dde; }
      #bvl button#bvl-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #556; background: rgba(20,26,34,.85); color: #dde; cursor: pointer; font-size: 18px; }
      #bvl-panel { margin-top: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid #556; background: rgba(20,26,34,.92); min-width: 150px; }
      #bvl-panel[hidden] { display: none; }
      #bvl-panel label { display: flex; gap: 6px; align-items: center; padding: 2px 0; cursor: pointer; }
      #bvl-panel h4 { margin: 0 0 4px; font-size: 11px; color: #9ab; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
